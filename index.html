<script>
    function changeLanguage(language) {
        document.documentElement.lang = language;

        // تحديد اتجاه الصفحة حسب اللغة
        document.documentElement.dir =
            language === "ar" ? "rtl" : "ltr";

        // تغيير النصوص
        document.querySelectorAll("[data-ar]").forEach(function(element) {
            element.textContent =
                element.getAttribute("data-" + language);
        });

        // تحديث أزرار اللغة
        document.getElementById("arBtn").classList.toggle(
            "active",
            language === "ar"
        );

        document.getElementById("trBtn").classList.toggle(
            "active",
            language === "tr"
        );
       // تحريك النص شمال يمين
       const movingText = document.getElementById("movingText");

if (movingText) {
    movingText.style.animationDirection =
        language === "ar" ? "reverse" : "normal";
}

        // تحديث عنوان الصفحة
        document.title = language === "ar"
            ? "متجري الفاخر"
            : "Lüks Mağazam";

        // حفظ اللغة المختارة
        localStorage.setItem("shopLanguage", language);
    }
// فتح نافذة تيليجرام
    function openWhatsapp() {
        document.getElementById("WhatsappModal").style.display = "flex";
    }

    // إغلاق نافذة تيليجرام
    function closeWhatsapp() {
        document.getElementById("WhatsappModal").style.display = "none";
    }

    // إغلاق النافذة عند الضغط خارج محتواها
    document.getElementById("WhatsappModal").addEventListener(
        "click",
        function(event) {
            if (event.target === this) {
                closeWhatsapp();
            }
        }
    );

    // استعادة اللغة المحفوظة
    const savedLanguage =
        localStorage.getItem("shopLanguage") || "ar";

    changeLanguage(savedLanguage);
</script>
